server:
  forward-headers-strategy: framework

spring:
  application:
    name: job-management-api
  security:
    user:
      name: ${STREAMMUX_API_USERNAME:streammux}
      password: ${STREAMMUX_API_PASSWORD:change-me-now}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    consumer:
      group-id: ${STREAMMUX_API_CONSUMER_GROUP:job-management-api-read-model-${random.uuid}}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    db:
      enabled: false

springdoc:
  show-actuator: true
  swagger-ui:
    # Swagger UI’s upstream default URL is petstore; disable it so direct hits to
    # /swagger-ui/index.html don’t show Petstore when configUrl isn’t applied.
    disable-swagger-default-url: true
    url: /v3/api-docs
    operationsSorter: method
    tagsSorter: alpha

streammux:
  auth:
    enabled: ${STREAMMUX_AUTH_ENABLED:false}
  security:
    oidc-enabled: ${OIDC_ENABLED:false}
    local-enabled: ${LOCAL_AUTH_ENABLED:true}
    lockout-threshold: 5
    lockout-duration: 15m
    session-timeout: ${STREAMMUX_SESSION_TIMEOUT:8h}
    remember-me-duration: ${STREAMMUX_REMEMBER_ME_DURATION:30d}
    oidc-default-roles:
      - viewer
  ui:
    url: ${STREAMMUX_UI_URL:}
  actor:
    trusted-proxy-headers-enabled: ${STREAMMUX_TRUSTED_PROXY_HEADERS:true}
  health:
    lag-warn-threshold: ${STREAMMUX_LAG_WARN_THRESHOLD:10000}
    heartbeat-stale-seconds: ${STREAMMUX_HEARTBEAT_STALE_SECONDS:300}
    lag-check-interval-ms: ${STREAMMUX_LAG_CHECK_INTERVAL_MS:30000}
  config-studio:
    enabled: ${CONFIG_STUDIO_ENABLED:false}
    gitlab-base-url: ${CONFIG_STUDIO_GITLAB_BASE_URL:https://gitlab.com}
    gitlab-project-id: ${CONFIG_STUDIO_GITLAB_PROJECT_ID:}
    gitlab-token: ${CONFIG_STUDIO_GITLAB_TOKEN:}
    default-branch: ${CONFIG_STUDIO_DEFAULT_BRANCH:main}
    default-environment: ${CONFIG_STUDIO_DEFAULT_ENVIRONMENT:}
    allowed-environments:
      - onelab
      - stage
      - prod
  topics:
    job-definitions: ${STREAMMUX_TOPIC_JOB_DEFINITIONS}
    job-leases: ${STREAMMUX_TOPIC_JOB_LEASES}
    job-status: ${STREAMMUX_TOPIC_JOB_STATUS}
    job-events: ${STREAMMUX_TOPIC_JOB_EVENTS}
    job-commands: ${STREAMMUX_TOPIC_JOB_COMMANDS}
  validation:
    topics:
      allowed-input-topics: ${STREAMMUX_ALLOWED_INPUT_TOPICS:}
      allowed-input-topic-prefixes: ${STREAMMUX_ALLOWED_INPUT_TOPIC_PREFIXES:}
      allowed-output-topics: ${STREAMMUX_ALLOWED_OUTPUT_TOPICS:}
      allowed-output-topic-prefixes: ${STREAMMUX_ALLOWED_OUTPUT_TOPIC_PREFIXES:}

---
# In-app auth needs Postgres (users, sessions, Flyway). Do not activate this
# document unless STREAMMUX_AUTH_ENABLED=true and STREAMMUX_DATABASE_URL is set.
spring:
  config:
    activate:
      on-property: streammux.auth.enabled=true
  datasource:
    url: ${STREAMMUX_DATABASE_URL}
    username: ${STREAMMUX_DATABASE_USERNAME:streammux}
    password: ${STREAMMUX_DATABASE_PASSWORD:streammux}
  flyway:
    enabled: ${STREAMMUX_FLYWAY_ENABLED:true}
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
management:
  health:
    db:
      enabled: true

---
# Config Studio uses the same Postgres when enabled without in-app auth.
spring:
  config:
    activate:
      on-property: streammux.config-studio.enabled=true
  datasource:
    url: ${STREAMMUX_DATABASE_URL}
    username: ${STREAMMUX_DATABASE_USERNAME:streammux}
    password: ${STREAMMUX_DATABASE_PASSWORD:streammux}
  flyway:
    enabled: ${STREAMMUX_FLYWAY_ENABLED:true}
management:
  health:
    db:
      enabled: true

