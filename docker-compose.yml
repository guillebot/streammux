x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?set KAFKA_BOOTSTRAP_SERVERS}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
  KAFKA_SSL_ENGINE_FACTORY_CLASS: ${KAFKA_SSL_ENGINE_FACTORY_CLASS:-}
  KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ${KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:-https}
  KAFKA_SSL_REJECT_UNAUTHORIZED: ${KAFKA_SSL_REJECT_UNAUTHORIZED:-false}
  KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-}

services:
  job-management-api:
    image: ${IMAGE_REPO:-registry.gitlab.com/dmr4013905/techarchitecture/techarchitecture/streammux}/job-management-api:${TAG:-latest}
    pull_policy: always
    environment:
      <<: *kafka-env
      STREAMMUX_API_USERNAME: ${STREAMMUX_API_USERNAME:-streammux}
      STREAMMUX_API_PASSWORD: ${STREAMMUX_API_PASSWORD:-change-me-now}
      STREAMMUX_TOPIC_JOB_DEFINITIONS: ${STREAMMUX_TOPIC_JOB_DEFINITIONS:-net.optimum.experimental.streamlens.streammux.jobdefinitions}
      STREAMMUX_TOPIC_JOB_LEASES: ${STREAMMUX_TOPIC_JOB_LEASES:-net.optimum.experimental.streamlens.streammux.jobleases}
      STREAMMUX_TOPIC_JOB_STATUS: ${STREAMMUX_TOPIC_JOB_STATUS:-net.optimum.experimental.streamlens.streammux.jobstatus}
      STREAMMUX_TOPIC_JOB_EVENTS: ${STREAMMUX_TOPIC_JOB_EVENTS:-net.optimum.experimental.streamlens.streammux.jobevents}
      STREAMMUX_TOPIC_JOB_COMMANDS: ${STREAMMUX_TOPIC_JOB_COMMANDS:-net.optimum.experimental.streamlens.streammux.jobcommands}
      STREAMMUX_ALLOWED_INPUT_TOPICS: ${STREAMMUX_ALLOWED_INPUT_TOPICS:-}
      STREAMMUX_ALLOWED_INPUT_TOPIC_PREFIXES: ${STREAMMUX_ALLOWED_INPUT_TOPIC_PREFIXES:-}
      STREAMMUX_ALLOWED_OUTPUT_TOPICS: ${STREAMMUX_ALLOWED_OUTPUT_TOPICS:-}
      STREAMMUX_ALLOWED_OUTPUT_TOPIC_PREFIXES: ${STREAMMUX_ALLOWED_OUTPUT_TOPIC_PREFIXES:-}
    ports:
      - "${JOB_MANAGEMENT_API_PORT:-8080}:8080"
    restart: unless-stopped

  job-catalog-api:
    image: ${IMAGE_REPO:-registry.gitlab.com/dmr4013905/techarchitecture/techarchitecture/streammux}/job-catalog-api:${TAG:-latest}
    pull_policy: always
    environment:
      <<: *kafka-env
      STREAMMUX_TOPIC_JOB_CATALOG: ${STREAMMUX_TOPIC_JOB_CATALOG:-net.optimum.experimental.streamlens.streammux.jobcatalog}
      JOB_MANAGEMENT_API_URL: http://job-management-api:8080
      STREAMMUX_API_USERNAME: ${STREAMMUX_API_USERNAME:-streammux}
      STREAMMUX_API_PASSWORD: ${STREAMMUX_API_PASSWORD:-change-me-now}
    depends_on:
      - job-management-api
    restart: unless-stopped

  web-ui:
    image: ${IMAGE_REPO:-registry.gitlab.com/dmr4013905/techarchitecture/techarchitecture/streammux}/web-ui:${TAG:-latest}
    pull_policy: always
    ports:
      - "${STREAMMUX_WEB_PORT:-8088}:80"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?set KAFKA_BOOTSTRAP_SERVERS}
      STREAMMUX_JOB_MANAGEMENT_API: ${STREAMMUX_JOB_MANAGEMENT_API_UPSTREAM:-job-management-api:8080}
      STREAMMUX_JOB_CATALOG_API: ${STREAMMUX_JOB_CATALOG_API_UPSTREAM:-job-catalog-api:3000}
      STREAMMUX_API_USERNAME: ${STREAMMUX_API_USERNAME:-streammux}
      STREAMMUX_API_PASSWORD: ${STREAMMUX_API_PASSWORD:-change-me-now}
    depends_on:
      - job-management-api
      - job-catalog-api
    restart: unless-stopped

  site-orchestrator:
    image: ${IMAGE_REPO:-registry.gitlab.com/dmr4013905/techarchitecture/techarchitecture/streammux}/site-orchestrator:${TAG:-latest}
    pull_policy: always
    environment:
      <<: *kafka-env
      STREAMMUX_SITE_ID: ${STREAMMUX_SITE_ID:-site-a}
      STREAMMUX_INSTANCE_ID: ${STREAMMUX_INSTANCE_ID:-orchestrator-1}
      STREAMMUX_TOPIC_JOB_DEFINITIONS: ${STREAMMUX_TOPIC_JOB_DEFINITIONS:-net.optimum.experimental.streamlens.streammux.jobdefinitions}
      STREAMMUX_TOPIC_JOB_LEASES: ${STREAMMUX_TOPIC_JOB_LEASES:-net.optimum.experimental.streamlens.streammux.jobleases}
      STREAMMUX_TOPIC_JOB_STATUS: ${STREAMMUX_TOPIC_JOB_STATUS:-net.optimum.experimental.streamlens.streammux.jobstatus}
      STREAMMUX_TOPIC_JOB_EVENTS: ${STREAMMUX_TOPIC_JOB_EVENTS:-net.optimum.experimental.streamlens.streammux.jobevents}
      STREAMMUX_TOPIC_JOB_COMMANDS: ${STREAMMUX_TOPIC_JOB_COMMANDS:-net.optimum.experimental.streamlens.streammux.jobcommands}
    restart: unless-stopped
    depends_on:
      - job-management-api


networks:
  traefik:
    external: true
    name: traefik-net
