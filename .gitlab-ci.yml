# =============================================================================
# Streammux GitLab CI/CD pipeline
# =============================================================================
# Test stage gates package: Java unit + integration (Testcontainers/dind), web-ui
# (vitest + build), Go (MCP), job-catalog-api (syntax check).
#
# Dev image tags (per service, images:build):
#   :<short-sha>            always (immutable per commit)
#   :<branch-slug>-<sha>    always (immutable, branch-scoped)
#   :<branch-slug>          on branch pipelines (mutable)
#   :latest                 only on default branch
#
# Release image tags (release:images / release:images:retag):
#   :YYYYMMDD-NN            immutable release tag only (no :latest)
#
# Registry layout (CI_REGISTRY_IMAGE = project registry root):
#   registry.gitlab.com/dmr4013905/techarchitecture/techarchitecture/streammux/<service>:<tag>
#
# Release cut: automatic release:tag on main (after tests) — see docs/DEPLOY.md
# =============================================================================

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - release
  - package

variables:
  # Project dependency proxy is not enabled; pull public Docker Hub images directly.
  DOCKER_HUB_PROXY: ""
  MAVEN_IMAGE: "maven:3.9.9-eclipse-temurin-21"
  IMAGE_REPO: "$CI_REGISTRY_IMAGE"
  DOCKER_TAG: "docker:29.1.3-cli"
  DOCKER_DIGEST: "sha256:4fa0ee1f3a7e4354c4ea34558b6d4ee32859baf4973d4c8ccc8e7fe3dd730c04"
  DIND_TAG: "docker:29.1.3-dind"
  DIND_DIGEST: "sha256:173f284a4299164772a90f52b373e73e087583c0963f1334c9995f190ef6f3f5"
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

.maven-job:
  image: "${MAVEN_IMAGE}"
  cache:
    key:
      files:
        - pom.xml
        - "**/pom.xml"
    paths:
      - .m2/repository
    policy: pull-push

.test-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:java:unit:
  extends: .maven-job
  stage: test
  script:
    - mvn -B test
  rules:
    - !reference [.test-rules, rules]

test:java:integration:
  extends: .maven-job
  stage: test
  allow_failure: true
  services:
    - name: "${DIND_TAG}@${DIND_DIGEST}"
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - mvn -B install -DskipTests
    - mvn -B verify -pl integration-tests
  rules:
    - !reference [.test-rules, rules]

test:web-ui:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - web-ui/package-lock.json
    paths:
      - web-ui/node_modules
    policy: pull-push
  script:
    - export VITE_APP_VERSION="$(bash scripts/build-app-version.sh)"
    - cd web-ui
    - npm ci
    - npm run test
    - npm run build
  rules:
    - !reference [.test-rules, rules]

test:go:
  stage: test
  image: golang:1.25-bookworm
  script:
    - go test ./...
  rules:
    - !reference [.test-rules, rules]

test:scripts:
  stage: test
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/build-app-version.test.sh
  rules:
    - !reference [.test-rules, rules]

test:job-catalog-api:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - job-catalog-api/package-lock.json
    paths:
      - job-catalog-api/node_modules
    policy: pull-push
  script:
    - cd job-catalog-api
    - npm ci
    - node --check server.mjs
    - node --check kafka-config.mjs
    - node --check catalog-health.mjs
    - npm test
  rules:
    - !reference [.test-rules, rules]

.docker-base:
  image: "${DOCKER_TAG}@${DOCKER_DIGEST}"
  services:
    - name: "${DIND_TAG}@${DIND_DIGEST}"
      alias: docker
  interruptible: false
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache bash
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create ci-dind --docker "host=${DOCKER_HOST},ca=${DOCKER_CERT_PATH}/ca.pem,cert=${DOCKER_CERT_PATH}/cert.pem,key=${DOCKER_CERT_PATH}/key.pem"
    - docker buildx create --use --name ci-builder --driver docker-container ci-dind
    - docker buildx inspect --bootstrap
    - SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
    - REF_SLUG="${CI_COMMIT_REF_SLUG}"
    - IMAGE="${IMAGE_REPO}/${IMAGE_NAME}"
    - |
      if [ -n "${RELEASE_TAG:-}" ]; then
        TAGS="${IMAGE}:${RELEASE_TAG}"
        APP_VERSION="${RELEASE_TAG}"
      else
        TAGS="${IMAGE}:${SHORT_SHA} ${IMAGE}:${REF_SLUG}-${SHORT_SHA}"
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          TAGS="${TAGS} ${IMAGE}:${CI_COMMIT_TAG}"
        else
          TAGS="${TAGS} ${IMAGE}:${REF_SLUG}"
        fi
        if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ] || [ -n "${CI_COMMIT_TAG:-}" ]; then
          TAGS="${TAGS} ${IMAGE}:latest"
        fi
        APP_VERSION="$(bash "${CI_PROJECT_DIR}/scripts/build-app-version.sh")"
      fi
    - TAG_ARGS=""
    - for t in $TAGS; do TAG_ARGS="${TAG_ARGS} --tag ${t}"; done
  script:
    - |
      if [ "${IMAGE_NAME}" = "web-ui" ]; then
        BUILD_ARGS="${BUILD_ARGS} --build-arg VITE_APP_VERSION=${APP_VERSION}"
      fi
    - |
      docker buildx build \
        --pull \
        --platform linux/amd64 \
        --cache-from "type=registry,ref=${IMAGE_REPO}/cache:${IMAGE_NAME}" \
        --cache-to "type=registry,ref=${IMAGE_REPO}/cache:${IMAGE_NAME},mode=max,ignore-error=true" \
        ${TAG_ARGS} \
        ${BUILD_ARGS} \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${APP_VERSION}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --file "${DOCKERFILE}" \
        "${BUILD_CONTEXT}" \
        $( [ "${PUSH:-true}" = "true" ] && echo "--push" || echo "--load" )
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      variables:
        PUSH: "false"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PUSH: "true"
    - if: $CI_COMMIT_BRANCH
      variables:
        PUSH: "true"
    - if: $CI_COMMIT_TAG
      variables:
        PUSH: "true"
    - when: never

.images-matrix:
  parallel:
    matrix:
      - IMAGE_NAME: job-management-api
        DOCKERFILE: Dockerfile.api
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
      - IMAGE_NAME: site-orchestrator
        DOCKERFILE: Dockerfile.orchestrator
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
      - IMAGE_NAME: web-ui
        DOCKERFILE: Dockerfile.web
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
      - IMAGE_NAME: job-catalog-api
        DOCKERFILE: Dockerfile.catalog
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
      - IMAGE_NAME: mcp
        DOCKERFILE: deploy/go.Dockerfile
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg SERVICE=mcp --build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"

# Automatic release cut on main (after tests): git tag YYYYMMDD-NN + build/push all
# images with that tag. Not Ansible — see docs/DEPLOY.md. Requires tag push
# permission (CI_JOB_TOKEN or RELEASE_GIT_PUSH_TOKEN project access token with
# write_repository).
release:tag:
  stage: release
  image:
    name: alpine/git:latest
    entrypoint: [""]
  resource_group: release
  interruptible: false
  needs:
    - job: test:java:unit
    - job: test:java:integration
      optional: true
    - job: test:web-ui
    - job: test:go
    - job: test:job-catalog-api
    - job: test:scripts
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache bash
    - git fetch --tags origin
  script:
    - bash scripts/next-release-tag.sh --assign
    - source release.env
    - echo "Creating release tag ${RELEASE_TAG} at ${CI_COMMIT_SHA}"
    - |
      if git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
        echo "ERROR: tag ${RELEASE_TAG} already exists" >&2
        exit 1
      fi
    - git config user.email "streammux-ci@${CI_SERVER_HOST}"
    - git config user.name "Streammux GitLab CI"
    - git tag -a "${RELEASE_TAG}" -m "Streammux release ${RELEASE_TAG} (${CI_COMMIT_SHORT_SHA})" "${CI_COMMIT_SHA}"
    - |
      PUSH_TOKEN="${RELEASE_GIT_PUSH_TOKEN:-${CI_JOB_TOKEN}}"
      git remote set-url origin "https://gitlab-ci-token:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin "${RELEASE_TAG}"
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

release:images:
  extends: .docker-base
  stage: release
  needs:
    - job: release:tag
      artifacts: true
  parallel: !reference [.images-matrix, parallel]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

release:images:retag:
  extends: .docker-base
  stage: release
  parallel: !reference [.images-matrix, parallel]
  variables:
    RELEASE_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{8}-\d{2}$/

images:build:
  extends: .docker-base
  stage: package
  needs:
    - job: test:java:unit
    - job: test:java:integration
      optional: true
    - job: test:web-ui
    - job: test:go
    - job: test:job-catalog-api
    - job: test:scripts
  parallel: !reference [.images-matrix, parallel]
  rules:
    # Release tags are built by release:images / release:images:retag with
    # VITE_APP_VERSION=RELEASE_TAG. Skip here to avoid overwriting that tag
    # with a SHA-baked UI build.
    - if: $CI_COMMIT_TAG =~ /^\d{8}-\d{2}$/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      variables:
        PUSH: "false"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PUSH: "true"
    - if: $CI_COMMIT_BRANCH
      variables:
        PUSH: "true"
    - if: $CI_COMMIT_TAG
      variables:
        PUSH: "true"
    - when: never
