# =============================================================================
# Streammux GitLab CI/CD pipeline
# =============================================================================
# Builds four container images and pushes to the GitLab Container Registry.
#
# Image tags (per service):
#   :<short-sha>            always (immutable per commit)
#   :<branch-slug>-<sha>    always (immutable, branch-scoped)
#   :<branch-slug>          on branch pipelines (mutable)
#   :<git-tag>              on tag pipelines
#   :latest                 only on default branch and tags
#
# Registry layout (CI_REGISTRY_IMAGE = project registry root):
#   registry.gitlab.com/dmr4013905/techarchitecture/techarchitecture/streammux/<service>:<tag>
#
# Manual releases: ./build_and_push.sh still bumps VERSION and pushes semver tags.
# =============================================================================

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - package

variables:
  # Project dependency proxy is not enabled; pull public Docker Hub images directly.
  DOCKER_HUB_PROXY: ""
  MAVEN_IMAGE: "maven:3.9.9-eclipse-temurin-21"
  IMAGE_REPO: "$CI_REGISTRY_IMAGE"
  DOCKER_TAG: "docker:29.1.3-cli"
  DOCKER_DIGEST: "sha256:4fa0ee1f3a7e4354c4ea34558b6d4ee32859baf4973d4c8ccc8e7fe3dd730c04"
  DIND_TAG: "docker:29.1.3-dind"
  DIND_DIGEST: "sha256:173f284a4299164772a90f52b373e73e087583c0963f1334c9995f190ef6f3f5"
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

.maven-job:
  image: "${MAVEN_IMAGE}"
  cache:
    key:
      files:
        - pom.xml
        - "**/pom.xml"
    paths:
      - .m2/repository
    policy: pull-push

.test-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:java:unit:
  extends: .maven-job
  stage: test
  script:
    - mvn -B test
  rules:
    - !reference [.test-rules, rules]

test:java:integration:
  extends: .maven-job
  stage: test
  services:
    - name: "${DIND_TAG}@${DIND_DIGEST}"
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - mvn -B install -DskipTests
    - mvn -B verify -pl integration-tests
  rules:
    - !reference [.test-rules, rules]

test:web-ui:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - web-ui/package-lock.json
    paths:
      - web-ui/node_modules
    policy: pull-push
  script:
    - cd web-ui
    - npm ci
    - npm run test
    - npm run build
  rules:
    - !reference [.test-rules, rules]

test:go:
  stage: test
  image: golang:1.25-bookworm
  script:
    - go test ./...
  rules:
    - !reference [.test-rules, rules]

test:job-catalog-api:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - job-catalog-api/package-lock.json
    paths:
      - job-catalog-api/node_modules
    policy: pull-push
  script:
    - cd job-catalog-api
    - npm ci
    - node --check server.mjs
    - node --check kafka-config.mjs
  rules:
    - !reference [.test-rules, rules]

.docker-base:
  stage: package
  image: "${DOCKER_TAG}@${DOCKER_DIGEST}"
  services:
    - name: "${DIND_TAG}@${DIND_DIGEST}"
      alias: docker
  interruptible: false
  needs:
    - job: test:java:unit
    - job: test:java:integration
    - job: test:web-ui
    - job: test:go
    - job: test:job-catalog-api
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create ci-dind --docker "host=${DOCKER_HOST},ca=${DOCKER_CERT_PATH}/ca.pem,cert=${DOCKER_CERT_PATH}/cert.pem,key=${DOCKER_CERT_PATH}/key.pem"
    - docker buildx create --use --name ci-builder --driver docker-container ci-dind
    - docker buildx inspect --bootstrap
  script:
    - SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
    - REF_SLUG="${CI_COMMIT_REF_SLUG}"
    - IMAGE="${IMAGE_REPO}/${IMAGE_NAME}"
    - TAGS="${IMAGE}:${SHORT_SHA} ${IMAGE}:${REF_SLUG}-${SHORT_SHA}"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAGS="${TAGS} ${IMAGE}:${CI_COMMIT_TAG}"
      else
        TAGS="${TAGS} ${IMAGE}:${REF_SLUG}"
      fi
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ] || [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAGS="${TAGS} ${IMAGE}:latest"
      fi
    - TAG_ARGS=""
    - for t in $TAGS; do TAG_ARGS="${TAG_ARGS} --tag ${t}"; done
    - |
      if [ "${IMAGE_NAME}" = "web-ui" ]; then
        APP_VERSION="$(tr -d '[:space:]' < "${CI_PROJECT_DIR}/VERSION" 2>/dev/null || echo "${CI_COMMIT_SHORT_SHA}")"
        BUILD_ARGS="${BUILD_ARGS} --build-arg VITE_APP_VERSION=${APP_VERSION}"
      fi
    - |
      docker buildx build \
        --pull \
        --platform linux/amd64 \
        --cache-from "type=registry,ref=${IMAGE_REPO}/cache:${IMAGE_NAME}" \
        --cache-to "type=registry,ref=${IMAGE_REPO}/cache:${IMAGE_NAME},mode=max,ignore-error=true" \
        ${TAG_ARGS} \
        ${BUILD_ARGS} \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --file "${DOCKERFILE}" \
        "${BUILD_CONTEXT}" \
        $( [ "${PUSH:-true}" = "true" ] && echo "--push" || echo "--load" )
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      variables:
        PUSH: "false"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PUSH: "true"
    - if: $CI_COMMIT_BRANCH
      variables:
        PUSH: "true"
    - if: $CI_COMMIT_TAG
      variables:
        PUSH: "true"
    - when: never

images:build:
  extends: .docker-base
  parallel:
    matrix:
      - IMAGE_NAME: job-management-api
        DOCKERFILE: Dockerfile.api
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
      - IMAGE_NAME: site-orchestrator
        DOCKERFILE: Dockerfile.orchestrator
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
      - IMAGE_NAME: web-ui
        DOCKERFILE: Dockerfile.web
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
      - IMAGE_NAME: job-catalog-api
        DOCKERFILE: Dockerfile.catalog
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
      - IMAGE_NAME: mcp
        DOCKERFILE: deploy/go.Dockerfile
        BUILD_CONTEXT: .
        BUILD_ARGS: "--build-arg SERVICE=mcp --build-arg DOCKER_HUB_PROXY=${DOCKER_HUB_PROXY}"
